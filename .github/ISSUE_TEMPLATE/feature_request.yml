name: ✨ 功能请求
description: 提议新接口、新能力或既有行为的变更
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        动手前先看两处，避免与既定顺序冲突：`docs/architecture.md` §15（实现顺序）与 `BACKEND_IMPROVEMENT_PLAN.md`（BE-01～BE-13）。
        只改文档的请求不必开功能 issue，直接提 PR 更合适。
  - type: textarea
    id: problem
    attributes:
      label: 背景与要解决的问题
      description: 谁在什么场景下遇到什么问题？当前只能怎么绕过？
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 主要落点
      options:
        - gateway-service
        - auth-service
        - contest-service
        - problem-service
        - submission-service
        - judge-service
        - anti-cheat-service
        - audit-service
        - media-service
        - ai-service
        - analytics-service
        - lunar-common
        - docker / 部署编排
        - 跨服务（需要先定契约）
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 期望的接口与契约
      description: 方法、路径、请求/响应字段、错误码、幂等要求（`Idempotency-Key` / `eventId`）、鉴权角色
      placeholder: |
        GET /api/v1/xxx?page=&pageSize=
        角色：ADMIN
        响应：ApiResponse 包裹的分页对象
        错误码：XXX_NOT_FOUND（需先登记到 docs/api.md）
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据与迁移影响
      description: 涉及的表/schema、只需新增 Flyway 版本还是需要回填、是否影响已有数据
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 权限、隐私与审计
      description: 角色与 RBAC 范围、是否触碰学生个人信息、是否需要写审计账本
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写成可执行、可观察的条目（命令 + 期望结果），不要写"正常工作"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么不用已有接口/已有组件解决？
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这与 `docs/` 下已有约定不冲突（冲突处已在上面说明）
          required: true
        - label: 我理解新增接口/错误码需要同步更新 `docs/api.md` 与 `CHANGELOG.md`
          required: true
