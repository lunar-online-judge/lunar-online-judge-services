# 持续集成：编译 + 单元测试 + 打包（与本地同一条命令 `mvn verify`），外加 Docker Compose 配置校验。
#
# 本工作流**不做**的事，避免误读：
#   - 不部署到任何环境：仓库目前没有定义部署目标、服务器与凭据；
#   - 不构建业务服务镜像：业务服务仍跑在宿主机，仓库里没有它们的 Dockerfile；
#   - 不跑需要真实中间件的集成测试：现有测试不依赖本机数据库状态（docs/development-guide.md §6）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的连续推送取消上一轮，PR 上尤其明显；主干也取消，因为后一次提交包含前一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建与单元测试（JDK 21）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21（与根 POM 的 java.version 一致）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify（编译 + 单元测试 + 打包）
        run: mvn -B -ntp verify

      # 测试失败时 surefire 报告是唯一能定位的线索，必须上传
      - name: 上传 surefire 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传各服务构件
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: "services/*/target/*.jar"
          if-no-files-found: warn
          retention-days: 7

  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 打印 Compose 版本（排障用）
        run: docker compose version

      - name: 校验各 Compose 文件可解析
        run: |
          set -euo pipefail
          # docker/compose.ai.yml 是有意保留的纯注释占位文件（`docker compose up`/`config`
          # 会以 "empty compose file" 退出 1，这正是它的语义），因此不放进校验清单。
          for file in \
            docker/compose.core.yml \
            docker/compose.platform.yml \
            docker/compose.edge.yml \
            docker/compose.judge.yml \
            docker/compose.full.yml
          do
            echo "::group::docker compose -f ${file} config -q"
            docker compose -f "${file}" config -q
            echo "::endgroup::"
          done
