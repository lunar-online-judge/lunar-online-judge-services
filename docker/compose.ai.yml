# 【已废弃】本地推理栈（Ollama）——本项目不再使用本地 AI 模型。
#
# 为什么保留这个文件（只有注释）而不是删掉：直接删会让照旧执行
# `docker compose -f docker/compose.ai.yml up -d` 的人只看到"文件不存在"（一个容易误判成
# "路径写错了"的报错）；保留占位则能让同一句命令打印下面的说明。本机实测（2026-10）：
# `… up -d` 与 `… config` 都以 `empty compose file` 退出（exit 1），不会创建工程、不会起容器——
# 这正是我们想要的效果：任何还照旧文档执行 up 的人会立刻停下，而不是在不知情的情况下
# 又起了一套本机推理。
#
# 现状（本轮起）：
#   - ai-service 只接入**云端 API 模型**（OpenAI 兼容端点），Provider 地址必须由部署方显式给出；
#   - 未配置 `AI_PROVIDER_BASE_URL`（或配置中心 `ai.provider.base-url`）时 ai-service **启动失败**
#     （AiPrivacyGuard 的 fail-closed 检查），不会再回落到 `http://localhost:11434/v1`；
#   - 数据出境门禁不变：地址判内网、授权只认环境变量 `AI_EGRESS_APPROVED`、每次构建模型前复核。
#
# 需要"内网自建网关"而不是云厂商时：部署自己的 OpenAI 兼容网关，把 `AI_PROVIDER_BASE_URL`
# 指向它的内网地址即可（此时不需要出境授权）；**不要**再回到本地 Ollama 这类本机模型运行时。
#
# 若将来要重新提供本地推理：请新建一份编排文件并先推翻这里的理由，不要在本文件里恢复 services。
