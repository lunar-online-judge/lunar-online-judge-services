services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lunar
      POSTGRES_USER: lunar
      POSTGRES_PASSWORD: change-me
    # 宿主机 5432 被本机 postgres 服务占用，开发期映射到 5433（容器内仍是 5432）；
    # 本地启动服务需设置 POSTGRES_PORT=5433。生产环境无此冲突，按实际端口注入即可
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    # 没有 healthcheck 时编排无法判断"库是否真的可连"，restart 策略让崩溃后能自愈
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar -d lunar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    # 加密码：限流计数与判题去重状态都在这里，无密码时任何能连 6379 的人都能读改它们
    # （绕过登录限流、伪造"已评测过"）。口令由 REDIS_PASSWORD 注入，生产必须换成强随机值。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    restart: unless-stopped
  # 注意：MinIO 目前**没有使用方**——截图链路（media-service）尚未实现，仓库里也没有 MinIO SDK。
  # 保留它是为了媒体链路落地时不必再改编排；生产部署前应删除或明确标注"未启用"。
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lunar
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
