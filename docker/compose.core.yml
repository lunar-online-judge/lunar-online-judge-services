services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lunar
      POSTGRES_USER: lunar
      POSTGRES_PASSWORD: change-me
    # 宿主机 5432 被本机 postgres 服务占用，开发期映射到 5433（容器内仍是 5432）；
    # 本地启动服务需设置 POSTGRES_PORT=5433。生产环境无此冲突，按实际端口注入即可
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lunar
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  minio-data:
