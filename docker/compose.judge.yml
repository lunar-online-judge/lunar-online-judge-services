# 评测沙箱节点（go-judge）——用户代码的唯一执行环境。
# 刻意使用独立默认网络：不与 core / platform / edge 共网，业务服务只能经 5050 端口访问其 HTTP API；
# go-judge 与业务服务分节点/分隔离运行时是生产要求（docs/architecture.md §14）。
services:
  go-judge:
    image: criyle/go-judge:latest
    # 未固定版本（本地工具链验证期），生产部署前必须锁定 digest 或明确版本
    privileged: true
    # 必须共享宿主 cgroup 命名空间：Docker Desktop（WSL2）下 private ns 的 cgroup 路径为空，
    # go-judge 启动即 fatal（cgroup path is empty）；共享后进程可执行，但嵌套 cgroup 内存限制
    # 在 Docker Desktop 上不可靠（已知限制，见 docs/deployment.md），生产 Linux 节点无此问题
    cgroup: host
    shm_size: "256m"
    # 文件缓存位于 /dev/shm，官方推荐值
    ports: ["5050:5050"]
