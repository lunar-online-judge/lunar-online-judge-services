# OpenResty 边缘反向代理：唯一对外入口，所有流量转发给 gateway-service。
# 挂载路径：/usr/local/openresty/nginx/conf/nginx.conf（官方镜像的 conf 目录）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent req_id=$http_x_request_id '
                    '"$http_user_agent"';
    access_log logs/access.log main;

    sendfile           on;
    keepalive_timeout  65;

    # 代码提交与测试点上传的请求体上限，按需调整
    client_max_body_size 10m;

    # WebSocket 升级：非 WS 请求 Connection 置空，保持上游 keepalive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 请求追踪：透传客户端带来的 X-Request-Id，缺失时由边缘生成
    map $http_x_request_id $trace_id {
        ''      $request_id;
        default $http_x_request_id;
    }

    # gateway-service 当前跑在宿主机（SERVER_PORT=8080）；
    # 服务容器化后改为对应容器名/服务名，并加入同一 Compose 网络
    upstream gateway {
        server host.docker.internal:8080;
        keepalive 32;
    }

    # 边缘限流（第一道闸）：登录端点按 IP 严格限速，防撞库/密码喷洒；其余 API 给一个宽松上限。
    # 业务侧的登录失败计数仍然生效（auth 的 Redis 限流），两层互不替代：
    # 边缘挡的是"高频请求"，业务侧挡的是"针对某个账号的连续失败"。
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen      80 default_server;
        server_name _;

        # 边缘自检，不回源
        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # 登录端点：每分钟 6 次、突发 3；超限直接 429，不落到后端
        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=3 nodelay;

            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_zone burst=40 nodelay;

            proxy_pass http://gateway;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $trace_id;

            proxy_connect_timeout 5s;
            # 长连接（WebSocket 心跳、监控页面）不被边缘提前断开
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }
}
