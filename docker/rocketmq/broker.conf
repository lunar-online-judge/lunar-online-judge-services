# RocketMQ broker 本地开发配置（apache/rocketmq:5.3.1）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

# 本地开发前提：Spring 服务跑在宿主机，broker 必须向 NameServer 广播 127.0.0.1，
# 否则注册的是容器内网 IP，宿主机客户端拿到后连不上。
# 服务以后容器化并加入同一 compose 网络时，注释掉这一行即可。
brokerIP1 = 127.0.0.1

# 开发期允许自动创建 Topic，省去手工建 Topic；生产必须改为 false 并显式建 Topic
autoCreateTopicEnable = true
