spring:
  application:
    name: anti-cheat-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:lunar}?stringtype=unspecified
    username: ${POSTGRES_USER:lunar}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    schemas: anti_cheat_schema
    table: anti_cheat_history
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/api/v1/auth/jwks}
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: anticheat_producer_group

server:
  port: ${SERVER_PORT:8086}
