spring:
  config:
    # 只从 Nacos 读取"运行时可变"的服务私有配置（docs/middleware.md"配置中心"节）；
    # optional: 保证 Nacos 不可达时用本地默认值启动，而不是启动失败
    import: optional:nacos:${spring.application.name}.yml
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        # 配置中心连接参数必须留本地：这是"从哪里取配置"的自举信息，无法从 Nacos 自身获取
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        # 注册进 Nacos（docs/middleware.md）；默认不因 Nacos 不可达而启动失败，NACOS_FAIL_FAST=true 可切回严格模式
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 注册 IP 固定 127.0.0.1：本机多网卡（VMware VMnet / WSL / 虚拟网卡）会被自动探测误选，
        # 与 RocketMQ brokerIP1=127.0.0.1 同理（docker/rocketmq/broker.conf）。服务容器化后须改为容器可达地址
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        fail-fast: ${NACOS_FAIL_FAST:false}
  datasource:
    # stringtype=unspecified：让 String 参数可直接写入 uuid 列（MyBatis 无 uuid 类型处理器）
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:lunar}?stringtype=unspecified
    username: ${POSTGRES_USER:lunar}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    placeholders:
      # 开发种子数据开关（V3 管理员账号）；生产必须显式设置 AUTH_DEV_SEED=false
      dev_seed: ${AUTH_DEV_SEED:true}
  data:
    redis:
      # 登录失败限流等短期状态（docs/middleware.md"Redis"节）：多实例共享、重启不清零、TTL 自动清理
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 超时故意设短：Redis 异常时快速失败并按 fail-open 放行，而不是拖慢登录
      timeout: ${REDIS_TIMEOUT_MS:1000}ms
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:500}ms
server:
  port: ${SERVER_PORT:8081}

auth:
  jwt:
    # RS256 私钥（PKCS#8 PEM 正文，可带可不带头尾行）。留空时启动期临时生成开发密钥：
    # 重启后已签发令牌全部失效；生产必须外部注入，密钥禁止入库
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    key-id: ${AUTH_JWT_KEY_ID:lunar-dev-1}
    access-ttl-minutes: ${AUTH_JWT_TTL_MINUTES:30}
  # auth.login.* 不在此处定义：阈值与锁定时长由 Nacos 配置中心托管（dataId=auth-service.yml）。
  # 注意 spring.config.import 导入的配置优先级**低于**本地 yml，本地若也写一份会永远盖住 Nacos 的值；
  # 离线兜底由 LoginProperties 的字段默认值提供（5 次 / 5 分钟），环境变量仍可覆盖

management:
  endpoints:
    web:
      exposure:
        # 只通过 HTTP 暴露 health（存活探测与运维排障够用），其余端点保持不可达
        include: health
  endpoint:
    health:
      # 只返回 UP/DOWN，不展示组件细节
      show-details: never
  health:
    redis:
      enabled: false
